[workspace]
resolver = "2"
members = ["crates/charfmt", "crates/sim", "crates/convert", "crates/modimport", "crates/gdscript", "crates/app"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.12"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
rayon = "1"
flate2 = "1"

# Bevy is slow without optimisation; optimise dependencies but keep our code quick to rebuild.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
